<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1190" role="img" aria-labelledby="title desc">
  <title id="title">R-019 kitchen-living ledge, draft plan and elevation</title>
  <desc id="desc">Concept-only drawing of a 1067 mm long by approximately 600 mm deep floor-supported ledge at 762 mm height, moved towards the sofa and meeting the west wall along its side.</desc>
  <defs>
    <pattern id="tile" width="43" height="43" patternUnits="userSpaceOnUse"><path d="M43 0H0V43" fill="none" stroke="#e3dfd7" stroke-width="1"/></pattern>
    <pattern id="flute" width="14" height="12" patternUnits="userSpaceOnUse"><rect width="14" height="12" fill="#4e4a45"/><rect x="9" width="3" height="12" fill="#756d64"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#9c5c3c"/></marker>
    <style>
      .bg{fill:#f7f4ee}.h{font:32px Georgia,serif;fill:#2e362f}.sub{font:15px Arial,sans-serif;fill:#6c716a}.label{font:16px Arial,sans-serif;fill:#37413a}.small{font:13px Arial,sans-serif;fill:#677169}.tiny{font:12px Arial,sans-serif;fill:#667169}.dim{font:15px Arial,sans-serif;fill:#9c5c3c;font-weight:bold}.section{font:22px Georgia,serif;fill:#2e362f}.wall{fill:#c2bdb3}.cab{fill:#b99c80}.sofa{fill:#dfd4c5}.ink{stroke:#9c5c3c;stroke-width:2;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1080" height="1190"/>
  <text x="58" y="66" class="h">Kitchen–living ledge</text>
  <text x="58" y="94" class="sub">R-019 · Concept for review · 28 October 2026 · All placement dimensions model-derived unless marked as a user dimension</text>
  <text x="58" y="147" class="section">Plan at the kitchen opening</text>
  <rect x="80" y="178" width="780" height="544" fill="url(#tile)" stroke="#cec9c0"/>
  <rect x="80" y="306" width="242" height="118" fill="#ece8df" stroke="#c2bdb3" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="128" y="365" class="small">STORE ZONE</text>
  <text x="98" y="215" class="label">LIVING</text>
  <text x="98" y="666" class="label">KITCHEN</text>
  <path d="M322 178H338V424H322Z" class="wall"/>
  <path d="M860 508H878V722H860Z" class="wall"/>
  <rect x="348" y="178" width="122" height="140" rx="14" class="sofa" stroke="#ac9984" stroke-width="2"/>
  <text x="373" y="273" class="small">SOFA</text>
  <path d="M344 178V369" stroke="#765d45" stroke-width="11"/>
  <text x="366" y="357" class="tiny">service plank ends here</text>
  <rect x="79" y="427" width="92" height="103" rx="4" fill="#b6bab6" stroke="#747e79" stroke-width="2"/>
  <text x="91" y="485" class="small">FRIDGE</text>
  <rect x="338" y="331" width="151" height="85" rx="3" fill="#eae2d3" stroke="#8a6e5d" stroke-width="3"/>
  <path d="M338 336H489" stroke="#4e4a45" stroke-width="8"/>
  <path d="M338 414H489" stroke="#bc9a77" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="355" y="378" class="label">NEW LEDGE</text>
  <text x="355" y="400" class="tiny">drawers face kitchen ↓</text>
  <rect x="709" y="467" width="151" height="48" fill="#a27954" stroke="#6b523e" stroke-width="2"/>
  <text x="755" y="497" fill="#fff7e9" font-family="Arial" font-size="15">PUJA</text>
  <path d="M338 505V529M489 505V529" stroke="#9c5c3c" stroke-width="2"/>
  <path d="M340 518H487" class="ink"/>
  <text x="345" y="547" class="dim">1,067 mm overall length</text>
  <path d="M491 452H706" class="ink"/>
  <text x="522" y="443" class="dim">1,562 mm model gap</text>
  <path d="M510 333V414" class="ink"/>
  <text x="522" y="381" class="small">600 mm</text>
  <text x="348" y="323" class="tiny">Meets wall along side</text>
  <text x="547" y="320" class="tiny">101 mm from sofa end</text>
  <text x="91" y="562" class="tiny">Fridge swing to verify</text>
  <text x="711" y="551" class="tiny">Puja leaves/tray to verify</text>
  <text x="81" y="748" class="small">Set back near sofa and flush to wall per user correction. Gaps are model values; site fit still needs checking.</text>

  <text x="58" y="813" class="section">Living face and section concept</text>
  <line x1="82" y1="1052" x2="905" y2="1052" stroke="#716e66" stroke-width="3"/>
  <rect x="167" y="862" width="460" height="190" fill="url(#flute)" stroke="#4e4a45" stroke-width="2"/>
  <rect x="176" y="1020" width="442" height="32" fill="#383b38"/>
  <rect x="153" y="851" width="488" height="15" rx="3" fill="#e7e0d7" stroke="#a39c90" stroke-width="2"/>
  <path d="M113 852V1050" class="ink"/>
  <text x="40" y="955" class="dim" transform="rotate(-90 40 955)">762 mm finished height</text>
  <path d="M167 1082H627" class="ink"/>
  <text x="296" y="1107" class="dim">1,067 mm user dimension</text>
  <text x="685" y="891" class="label">Light stone-look top</text>
  <text x="685" y="924" class="label">Wipeable shallow fluting</text>
  <text x="685" y="957" class="label">Optional shielded LED</text>
  <text x="685" y="990" class="label">Kitchen-side drawer storage</text>
  <text x="685" y="1023" class="label">Recessed washable plinth</text>
  <text x="58" y="1163" class="small">No dining set, pendants, sink, hob or change to the approved kitchen cabinet layout.</text>
</svg>
